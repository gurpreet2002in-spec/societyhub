org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The project lives on F: while the pub cache is on C:. Kotlin's incremental
# compiler can't handle sources on different drives on Windows and crashes with
# "Could not close incremental caches" (seen in android/.kotlin/errors).
kotlin.incremental=false

# Keep memory use modest so the build doesn't run the PC out of memory:
# compile Kotlin inside Gradle (no separate Kotlin daemon) and limit parallel workers.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
