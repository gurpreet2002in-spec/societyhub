name: society_hub
description: "SocietyHub SaaS Product"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  mobile_scanner: ^5.1.1
  supabase_flutter: ^2.8.4
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
  flutter_dotenv: ^5.1.0
  # Flats register: import (pick a CSV) and export (share / save the CSV)
  file_picker: ^10.3.7
  share_plus: ^11.1.0
  # Gate pass QR code shown to residents / visitors
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
